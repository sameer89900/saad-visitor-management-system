# ============================================
# REAL TIME SMART VISITOR MANAGEMENT SYSTEM
# ============================================
spring.application.name=Visitor Management System

# ============================================
# DATABASE — MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/visitor_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sameer@890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# SERVER
# ============================================
server.port=9090
server.servlet.context-path=/api

# ============================================
# JWT
# ============================================
jwt.secret=VMS_SECRET_KEY_FOR_JWT_TOKEN_GENERATION_2024
jwt.expiration=86400000

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# CORS
# ============================================
cors.allowed-origins=http://localhost:3000

# ============================================
# LOGGING
# ============================================
logging.level.root=WARN
logging.level.com.vms=INFO
logging.level.org.hibernate=ERROR